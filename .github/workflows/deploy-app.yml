name: Deploy App To VPS

on:
  workflow_call:
    inputs:
      queue_url:
        description: Queue URL from Terraform outputs
        required: true
        type: string
      app_runtime_aws_access_key_id:
        description: App runtime AWS access key ID
        required: true
        type: string
      app_runtime_aws_secret_access_key:
        description: App runtime AWS secret access key
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy_app:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::608907253722:role/github-actions-drawing-board
          aws-region: ${{ secrets.TF_AWS_REGION }}

      - name: Verify AWS Caller Identity
        run: aws sts get-caller-identity

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download CA Certificate
        run: aws s3 cp "${{ secrets.TF_CA_CERT_S3_URI }}" app/server/ca-certificate.crt

      - name: Install Server Dependencies
        working-directory: app/server
        run: npm i

      - name: Prepare App Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_ADDRESS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            mkdir -p "${{ secrets.PROJECT_PATH }}"
            rm -rf "${{ secrets.PROJECT_PATH }}/server"

      - name: Upload App Directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IP_ADDRESS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: app/
          target: ${{ secrets.PROJECT_PATH }}
          strip_components: 1

      - name: Rebuild Server Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_ADDRESS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            cat <<EOF > .env
            AWS_ACCESS_KEY_ID=${{ inputs.app_runtime_aws_access_key_id }}
            AWS_SECRET_ACCESS_KEY=${{ inputs.app_runtime_aws_secret_access_key }}
            AWS_REGION=${{ secrets.TF_AWS_REGION }}
            QUEUE_URL=${{ inputs.queue_url }}
            username=${{ secrets.TF_DB_USERNAME }}
            password=${{ secrets.TF_DB_PASSWORD }}
            host=${{ secrets.TF_DB_HOST }}
            port=${{ secrets.TF_DB_PORT }}
            database=${{ secrets.TF_DB_NAME }}
            sslmode=${{ secrets.TF_DB_SSLMODE }}
            EOF
            docker compose up -d --build express1 express2 nginx
