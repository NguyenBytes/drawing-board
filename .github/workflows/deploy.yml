name: Provision AWS and Deploy to VPS

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    outputs:
      queue_url: ${{ steps.terraform_outputs.outputs.queue_url }}
      app_runtime_aws_access_key_id: ${{ steps.terraform_outputs.outputs.app_runtime_aws_access_key_id }}
      app_runtime_aws_secret_access_key: ${{ steps.terraform_outputs.outputs.app_runtime_aws_secret_access_key }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::608907253722:role/github-actions-drawing-board
          aws-region: ${{ secrets.TF_AWS_REGION }}

      - name: Verify AWS Caller Identity
        run: aws sts get-caller-identity

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download CA Certificate
        run: |
          aws s3 cp "${{ secrets.TF_CA_CERT_S3_URI }}" lambda/ca-certificate.crt
          aws s3 cp "${{ secrets.TF_CA_CERT_S3_URI }}" app/server/ca-certificate.crt

      - name: Install Lambda Dependencies
        working-directory: lambda
        run: npm i

      - name: Package Lambda Zip
        working-directory: lambda
        run: npm run zip

      - name: Write Prod Terraform Vars
        working-directory: terraform
        run: |
          cat <<EOF > prod.tfvars
          aws_region     = "${{ secrets.TF_AWS_REGION }}"
          project_name   = "${{ secrets.TF_PROJECT_NAME }}"
          username       = "${{ secrets.TF_DB_USERNAME }}"
          password       = "${{ secrets.TF_DB_PASSWORD }}"
          host           = "${{ secrets.TF_DB_HOST }}"
          port           = "${{ secrets.TF_DB_PORT }}"
          database       = "${{ secrets.TF_DB_NAME }}"
          sslmode        = "${{ secrets.TF_DB_SSLMODE }}"
          EOF

      - name: Terraform Plan Prod
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.TF_AWS_REGION }}
        run: |
          terraform init
          terraform validate
          terraform workspace select prod || terraform workspace new prod
          terraform plan -out=tfplan -var-file=prod.tfvars

      - name: Terraform Apply Prod
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.TF_AWS_REGION }}
        run: terraform apply -auto-approve tfplan

      - name: Capture Prod Runtime Outputs
        id: terraform_outputs
        working-directory: terraform
        env:
          AWS_REGION: ${{ secrets.TF_AWS_REGION }}
        run: |
          terraform workspace select prod
          queue_url="$(terraform output -raw queue_url)"
          access_key_id="$(terraform output -raw app_runtime_aws_access_key_id)"
          secret_access_key="$(terraform output -raw app_runtime_aws_secret_access_key)"
          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          echo "queue_url=$queue_url" >> "$GITHUB_OUTPUT"
          echo "app_runtime_aws_access_key_id=$access_key_id" >> "$GITHUB_OUTPUT"
          echo "app_runtime_aws_secret_access_key=$secret_access_key" >> "$GITHUB_OUTPUT"

  deploy_app:
    needs: provision
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::608907253722:role/github-actions-drawing-board
          aws-region: ${{ secrets.TF_AWS_REGION }}

      - name: Verify AWS Caller Identity
        run: aws sts get-caller-identity

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download CA Certificate
        run: aws s3 cp "${{ secrets.TF_CA_CERT_S3_URI }}" app/server/ca-certificate.crt

      - name: Install Server Dependencies
        working-directory: app/server
        run: npm i

      - name: Prepare App Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_ADDRESS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            mkdir -p "${{ secrets.PROJECT_PATH }}"
            rm -rf "${{ secrets.PROJECT_PATH }}/server"

      - name: Upload App Directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IP_ADDRESS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: app/
          target: ${{ secrets.PROJECT_PATH }}
          strip_components: 1

      - name: Rebuild Server Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_ADDRESS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            cat <<EOF > .env
            AWS_ACCESS_KEY_ID=${{ needs.provision.outputs.app_runtime_aws_access_key_id }}
            AWS_SECRET_ACCESS_KEY=${{ needs.provision.outputs.app_runtime_aws_secret_access_key }}
            AWS_REGION=${{ secrets.TF_AWS_REGION }}
            QUEUE_URL=${{ needs.provision.outputs.queue_url }}
            username=${{ secrets.TF_DB_USERNAME }}
            password=${{ secrets.TF_DB_PASSWORD }}
            host=${{ secrets.TF_DB_HOST }}
            port=${{ secrets.TF_DB_PORT }}
            database=${{ secrets.TF_DB_NAME }}
            sslmode=${{ secrets.TF_DB_SSLMODE }}
            EOF
            docker compose up -d --build express1 express2 nginx
