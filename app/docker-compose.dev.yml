services:
  express:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: drawing-board-dev-express
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - SERVER_ID=dev
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - QUEUE_URL=${QUEUE_URL}
      - username=${username}
      - password=${password}
      - host=${host}
      - port=${port}
      - database=${database}
      - sslmode=${sslmode}
    networks:
      - app-dev-network

  grafana:
    image: grafana/grafana:latest
    container_name: drawing-board-dev-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - AWS_ACCESS_KEY_ID=${GRAFANA_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${GRAFANA_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - GRAFANA_AWS_ROLE_ARN=${GRAFANA_AWS_ROLE_ARN}
    volumes:
      - grafana-dev-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app-dev-network

networks:
  app-dev-network:
    driver: bridge

volumes:
  grafana-dev-data:
