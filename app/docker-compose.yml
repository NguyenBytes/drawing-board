services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - express1
      - express2
    restart: unless-stopped
    networks:
      - app-network

  express1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: express-server-1
    expose:
      - "3000"
    volumes:
      - ./cert:/cert:ro
    environment:
      - NODE_ENV=production
      - SERVER_ID=1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - QUEUE_URL=${QUEUE_URL}
      # Your exact variable names
      - username=${username}
      - password=${password}
      - host=${host}
      - port=${port}
      - database=${database}
      - sslmode=${sslmode}
    restart: unless-stopped
    networks:
      - app-network

  express2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: express-server-2
    expose:
      - "3000"
    volumes:
      - ./cert:/cert:ro
    environment:
      - NODE_ENV=production
      - SERVER_ID=2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - QUEUE_URL=${QUEUE_URL}
      # Your exact variable names
      - username=${username}
      - password=${password}
      - host=${host}
      - port=${port}
      - database=${database}
      - sslmode=${sslmode}
    restart: unless-stopped
    networks:
      - app-network

  # Disabled for local development. Restore this service and the matching
  # monitor nginx block before deploying Grafana again.
